name: Scrape & Deploy

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create required directories
        run: mkdir -p logs output

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python main.py --all
        env:
          PYTHONUNBUFFERED: 1

      - name: Build dashboard data
        run: node dashboard/build-data.js

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "---"
          echo "All envs: $(gh api repos/jayeshm14/scrapper/environments --jq '.environments[].name' 2>&1)"
          echo "---"
          echo "Secrets in Actions env: $(gh api repos/jayeshm14/scrapper/environments/Actions/secrets --jq '.secrets[].name' 2>&1)"
          echo "---"
          echo "Variables in Actions env: $(gh api repos/jayeshm14/scrapper/environments/Actions/variables --jq '.variables[].name' 2>&1)"
          echo "---"
          echo "Secrets at repo level: $(gh api repos/jayeshm14/scrapper/actions/secrets --jq '.secrets[].name' 2>&1)"
          echo "---"
          echo "Trying deploy..."
          wrangler pages deploy dashboard --project-name noida-property-dashboard --commit-dirty=true

      - name: Upload output artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scraper-output-${{ github.run_number }}
          path: output/
          retention-days: 7