name: Scrape & Deploy

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: scrape-db
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install awscli

      - name: Install Playwright browser
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      - name: Cache adaptive fingerprints
        uses: actions/cache@v4
        with:
          path: ./.scrapling_cache
          key: scrapling-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            scrapling-cache-

      - name: Create required directories
        run: mkdir -p logs output data/consolidated .scrapling_cache

      - name: Download previous DB artifact (safe to fail on first run)
        run: gh run download --name scraper-db --dir data/consolidated/ --repo ${{ github.repository }} || true

      - name: Download previous fallback/history state
        run: gh run download --name scraper-state --dir data/ --repo ${{ github.repository }} 2>/dev/null || true

      - name: Run scraper
        run: python main.py --all
        env:
          PYTHONUNBUFFERED: 1

      - name: Run anomaly detection
        run: python check_anomalies.py --summary $GITHUB_STEP_SUMMARY

      - name: Consolidate to SQLite
        run: python consolidate.py --sites 99acres magicbricks squareyards olx proptiger proptiger-flats

      - name: Sync DB to Cloudflare R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          BACKUP="noida_properties-$(date -u +%Y%m%d_%H%M%S).db.gz"
          gzip -c data/consolidated/noida_properties.db > "/tmp/$BACKUP"
          aws s3 cp "/tmp/$BACKUP" "s3://$R2_BUCKET_NAME/db-backups/$BACKUP" \
            --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --region auto
          aws s3 cp "/tmp/$BACKUP" "s3://$R2_BUCKET_NAME/noida_properties-latest.db.gz" \
            --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --region auto
          echo "R2_BACKUP=$BACKUP" >> $GITHUB_ENV

      - name: Build dashboard data from DB
        run: python dashboard/build-data.py

      - name: Upload DB artifact for next run
        uses: actions/upload-artifact@v4
        with:
          name: scraper-db
          path: data/consolidated/noida_properties.db
          retention-days: 90
          overwrite: true

      - name: Upload fallback/history state for next run
        uses: actions/upload-artifact@v4
        with:
          name: scraper-state
          path: |
            data/yield_history.json
            data/fallback_state.json
            data/fallback_anomaly.json
          retention-days: 90
          overwrite: true

      - name: Upload dashboard artifact for deploy job
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-build
          path: dashboard/
          retention-days: 7
          overwrite: true

      - name: Upload raw output artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scraper-output-${{ github.run_number }}
          path: |
            output/
            data/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: scrape
    environment: deploy
    steps:
      - name: Download dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-build
          path: dashboard/

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to production
        run: CLOUDFLARE_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}" wrangler pages deploy dashboard --project-name noida-property-dashboard --branch ${{ github.ref_name }} --commit-dirty=true
