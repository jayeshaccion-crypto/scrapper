name: Scrape & Deploy

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create required directories
        run: mkdir -p logs output data/consolidated

      - name: Download previous DB artifact (safe to fail on first run)
        run: gh run download --name scraper-db --dir data/consolidated/ --repo ${{ github.repository }} || true

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python main.py --all
        env:
          PYTHONUNBUFFERED: 1

      - name: Consolidate to SQLite (appends new data, upserts existing)
        run: python consolidate.py --sites 99acres magicbricks squareyards olx proptiger

      - name: Build dashboard data from DB
        run: python dashboard/build-data.py

      - name: Upload DB artifact for next run
        uses: actions/upload-artifact@v4
        with:
          name: scraper-db
          path: data/consolidated/noida_properties.db
          retention-days: 90
          overwrite: true

      - name: Upload dashboard artifact for deploy job
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-build
          path: dashboard/
          retention-days: 7
          overwrite: true

      - name: Upload raw output artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scraper-output-${{ github.run_number }}
          path: |
            output/
            data/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: scrape
    environment: deploy
    steps:
      - name: Download dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-build
          path: dashboard/

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to production
        run: CLOUDFLARE_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}" wrangler pages deploy dashboard --project-name noida-property-dashboard --branch ${{ github.ref_name }} --commit-dirty=true
